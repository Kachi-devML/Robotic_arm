; 4-DoF robotic arm — M5 state machine, homing, and safety (ESP32-S3)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.16
    links2004/WebSockets @ ^2.4.1
build_src_filter =
    +<*>
    +<../kinematics/>
    +<../utils/>
    +<../motion/>
    +<../control/>
    +<../comms/>
    +<../tasks/>
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same board; LOG_* macros compile out entirely.
[env:esp32s3_release]
extends = env:esp32s3
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Initializes drivers and commands a known servo angle + step count.
; Verify by eye. The default env homes through the state machine instead.
[env:esp32s3_driver_bench]
extends = env:esp32s3
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDRIVER_BENCH=1

; Full state machine and homing, no GPIO/I2C writes (AGENT_BUILD_SPEC §9).
; Virtual home switch is at step 0.
[env:esp32s3_sim]
extends = env:esp32s3
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSIM_MODE

; Desktop-native environment for unit-testing pure modules (kinematics, motion
; profiling) without any Arduino/ESP32 dependencies.
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<../kinematics/>
    +<../motion/>
    +<../control/>
    -<../motion/ServoDriver.cpp>
    -<../motion/StepperDriver.cpp>
build_flags =
    -Iconfig
    -Ikinematics
    -Imotion
    -Icontrol
    -Iutils
    -std=c++17
