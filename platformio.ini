; 4-DoF robotic arm — state machine and safety (ESP32-S3)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/embed_assets.py
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.16
    links2004/WebSockets @ ^2.4.1
build_src_filter =
    +<*>
    +<../kinematics/>
    +<../utils/>
    +<../motion/>
    +<../control/>
    +<../comms/>
    +<../tasks/>
    -<calibration_main.cpp>
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same board; LOG_* macros compile out entirely.
[env:esp32s3_release]
extends = env:esp32s3
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Initializes drivers and commands a known servo angle + step count.
; Verify by eye. The default environment starts in IDLE.
[env:esp32s3_driver_bench]
extends = env:esp32s3
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDRIVER_BENCH=1

; Full state machine, no GPIO/I2C writes (AGENT_BUILD_SPEC §9).
[env:esp32s3_sim]
extends = env:esp32s3
build_flags =
    -std=gnu++17
    -Iconfig
    -Iutils
    -Ikinematics
    -Imotion
    -Icontrol
    -Icomms
    -Itasks
    -DLOG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSIM_MODE

; Standalone serial-only servo calibration tool; no network or planner sources.
[env:esp32s3_calib]
extends = env:esp32s3
build_src_filter =
    +<calibration_main.cpp>
    +<../motion/>
    +<../control/>
    +<../utils/>
    -<../motion/SCurveProfile.cpp>
    -<../motion/TrajectoryPlanner.cpp>
    -<../control/StateMachine.cpp>
lib_deps =
build_flags =
    ${env:esp32s3.build_flags}
    -DCALIBRATION_MODE

; Desktop-native environment for unit-testing pure modules (kinematics, motion
; profiling) without any Arduino/ESP32 dependencies.
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<../kinematics/>
    +<../motion/>
    +<../control/>
    -<../motion/ServoDriver.cpp>
    -<../motion/StepperDriver.cpp>
build_flags =
    -Iconfig
    -Ikinematics
    -Imotion
    -Icontrol
    -Iutils
    -std=c++17
